<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Time — Global Clock Network</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0e27;
            --bg-gradient-start: #0a0e27;
            --bg-gradient-end: #1a1d3a;
            --accent-gold: #f4d03f;
            --accent-blue: #4db8ff;
            --accent-pink: #ff6b9d;
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #a8b2d1;
            --text-muted: #666c8e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background elements */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.15;
            animation: float 20s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: var(--accent-blue);
            top: -100px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 300px;
            height: 300px;
            background: var(--accent-pink);
            bottom: -50px;
            left: -50px;
            animation-delay: 7s;
        }

        .orb-3 {
            width: 250px;
            height: 250px;
            background: var(--accent-gold);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: 14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
            animation: fadeInDown 0.8s ease-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: 900;
            margin-bottom: 10px;
            background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-blue) 50%, var(--accent-pink) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 400;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            color: var(--text-secondary);
            padding: 15px 40px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'DM Sans', sans-serif;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .tab-btn:hover {
            border-color: var(--accent-blue);
            transform: translateY(-2px);
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
            border-color: transparent;
            color: var(--text-primary);
            box-shadow: 0 10px 30px rgba(77, 184, 255, 0.3);
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .tab-content.active {
            display: block;
        }

        /* World Clocks Grid */
        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .clock-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 30px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s ease;
            animation: fadeInUp 0.6s ease-out backwards;
        }

        .clock-card:nth-child(1) { animation-delay: 0.1s; }
        .clock-card:nth-child(2) { animation-delay: 0.15s; }
        .clock-card:nth-child(3) { animation-delay: 0.2s; }
        .clock-card:nth-child(4) { animation-delay: 0.25s; }
        .clock-card:nth-child(5) { animation-delay: 0.3s; }
        .clock-card:nth-child(6) { animation-delay: 0.35s; }
        .clock-card:nth-child(7) { animation-delay: 0.4s; }
        .clock-card:nth-child(8) { animation-delay: 0.45s; }
        .clock-card:nth-child(9) { animation-delay: 0.5s; }
        .clock-card:nth-child(10) { animation-delay: 0.55s; }
        .clock-card:nth-child(11) { animation-delay: 0.6s; }
        .clock-card:nth-child(12) { animation-delay: 0.65s; }
        .clock-card:nth-child(13) { animation-delay: 0.7s; }
        .clock-card:nth-child(14) { animation-delay: 0.75s; }
        .clock-card:nth-child(15) { animation-delay: 0.8s; }

        .clock-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-blue), var(--accent-pink));
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .clock-card:hover {
            border-color: var(--accent-blue);
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(77, 184, 255, 0.2);
        }

        .clock-card:hover::before {
            opacity: 1;
        }

        .city-name {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 5px;
            color: var(--text-primary);
        }

        .timezone-offset {
            font-size: 0.85rem;
            color: var(--accent-gold);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .analog-clock {
            width: 150px;
            height: 150px;
            margin: 20px auto;
            position: relative;
            border: 3px solid var(--card-border);
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
        }

        .clock-center {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: var(--accent-gold);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            box-shadow: 0 0 10px var(--accent-gold);
        }

        .clock-hand {
            position: absolute;
            background: var(--text-primary);
            transform-origin: bottom center;
            left: 50%;
            border-radius: 5px;
        }

        .hour-hand {
            width: 4px;
            height: 40px;
            background: var(--accent-blue);
            bottom: 50%;
            margin-left: -2px;
            z-index: 2;
        }

        .minute-hand {
            width: 3px;
            height: 55px;
            background: var(--text-primary);
            bottom: 50%;
            margin-left: -1.5px;
            z-index: 2;
        }

        .second-hand {
            width: 2px;
            height: 60px;
            background: var(--accent-pink);
            bottom: 50%;
            margin-left: -1px;
            z-index: 2;
        }

        .digital-time {
            text-align: center;
            font-size: 2rem;
            font-weight: 700;
            margin-top: 15px;
            font-variant-numeric: tabular-nums;
            letter-spacing: 2px;
        }

        .date-display {
            text-align: center;
            font-size: 0.9rem;
            color: #c4d0f0;
            margin-top: 5px;
            font-weight: 500;
        }

        /* Timezone Converter */
        .converter-container {
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 50px;
            animation: fadeInUp 0.6s ease-out;
        }

        .converter-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .converter-section {
            margin-bottom: 30px;
        }

        .converter-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 600;
        }

        .converter-input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        select, input[type="time"], input[type="date"] {
            flex: 1;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1rem;
            font-family: 'DM Sans', sans-serif;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        select:focus, input:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.18);
        }
        
        /* Make date/time picker text brighter */
        input[type="time"]::-webkit-calendar-picker-indicator,
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(1.5);
            cursor: pointer;
        }

        option {
            background: var(--bg-dark);
            color: var(--text-primary);
        }

        .convert-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-pink));
            border: none;
            color: var(--text-primary);
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'DM Sans', sans-serif;
            margin-top: 20px;
        }

        .convert-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(77, 184, 255, 0.4);
        }

        .result-container {
            margin-top: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            border: 2px solid var(--accent-gold);
            display: none;
        }

        .result-container.show {
            display: block;
            animation: slideUp 0.5s ease-out;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 15px;
        }

        .result-location {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .result-time {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-date {
            font-size: 0.9rem;
            color: #c4d0f0;
            margin-top: 5px;
            font-weight: 500;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.5rem; }
            .subtitle { font-size: 0.9rem; }
            .clocks-grid { grid-template-columns: 1fr; }
            .converter-container { padding: 30px 20px; }
            .converter-input-group { flex-direction: column; }
            .tabs { flex-direction: column; gap: 10px; }
        }

        /* Cities Table Styles */
        .table-container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 30px;
            padding: 40px;
            animation: fadeInUp 0.6s ease-out;
        }

        .table-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, var(--accent-gold), var(--accent-blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-box {
            width: 100%;
            background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 15px 20px;
            border-radius: 15px;
            font-size: 1.1rem;
            font-family: 'DM Sans', sans-serif;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-blue);
            background: rgba(255, 255, 255, 0.18);
        }

        .search-box::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .cities-table-wrapper {
            max-height: 600px;
            overflow-y: auto;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.02);
        }

        .cities-table-wrapper::-webkit-scrollbar {
            width: 10px;
        }

        .cities-table-wrapper::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
        }

        .cities-table-wrapper::-webkit-scrollbar-thumb {
            background: var(--accent-blue);
            border-radius: 10px;
        }

        .cities-table-wrapper::-webkit-scrollbar-thumb:hover {
            background: var(--accent-pink);
        }

        .cities-table {
            width: 100%;
            border-collapse: collapse;
        }

        .cities-table thead {
            position: sticky;
            top: 0;
            background: linear-gradient(135deg, rgba(77, 184, 255, 0.2), rgba(255, 107, 157, 0.2));
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .cities-table th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 700;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.85rem;
            border-bottom: 2px solid var(--accent-blue);
        }

        .cities-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #c4d0f0;
            font-weight: 500;
        }

        .cities-table tbody tr {
            transition: all 0.3s ease;
        }

        .cities-table tbody tr:hover {
            background: rgba(77, 184, 255, 0.1);
            transform: scale(1.01);
        }

        .table-city-name {
            font-weight: 700;
            color: var(--text-primary);
            font-size: 1.05rem;
        }

        .table-country {
            color: var(--accent-gold);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .table-time {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-blue);
            font-variant-numeric: tabular-nums;
        }

        .table-date {
            color: #c4d0f0;
            font-size: 0.9rem;
        }

        .table-timezone {
            color: var(--accent-gold);
            font-weight: 600;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="bg-decoration">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <header>
            <h1>World Time</h1>
            <p class="subtitle">Global Clock Network</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('clocks')">World Clocks</button>
            <button class="tab-btn" onclick="switchTab('converter')">Time Converter</button>
            <button class="tab-btn" onclick="switchTab('allcities')">All Cities</button>
        </div>

        <!-- World Clocks Tab -->
        <div id="clocks-tab" class="tab-content active">
            <div class="clocks-grid" id="clocksGrid"></div>
        </div>

        <!-- Timezone Converter Tab -->
        <div id="converter-tab" class="tab-content">
            <div class="converter-container">
                <h2 class="converter-title">Convert Time Zones</h2>
                
                <div class="converter-section">
                    <div class="converter-label">From</div>
                    <div class="converter-input-group">
                        <select id="sourceCity">
                            <option value="">Select City</option>
                        </select>
                        <input type="time" id="sourceTime" value="12:00">
                        <input type="date" id="sourceDate">
                    </div>
                </div>

                <div class="converter-section">
                    <div class="converter-label">To</div>
                    <div class="converter-input-group">
                        <select id="destCity">
                            <option value="">Select City</option>
                        </select>
                    </div>
                </div>

                <button class="convert-btn" onclick="convertTime()">Convert Time</button>

                <div id="resultContainer" class="result-container">
                    <div class="result-row">
                        <div>
                            <div class="result-location" id="sourceLocation"></div>
                            <div class="result-date" id="sourceFullDate"></div>
                        </div>
                        <div style="text-align: right;">
                            <div class="result-time" id="sourceResultTime"></div>
                        </div>
                    </div>
                    <div class="result-row">
                        <div>
                            <div class="result-location" id="destLocation"></div>
                            <div class="result-date" id="destFullDate"></div>
                        </div>
                        <div style="text-align: right;">
                            <div class="result-time" id="destResultTime"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- All Cities Tab -->
        <div id="allcities-tab" class="tab-content">
            <div class="table-container">
                <h2 class="table-title">World Time - All Cities</h2>
                <input type="text" id="searchBox" class="search-box" placeholder="🔍 Search cities..." onkeyup="filterCities()">
                
                <div class="cities-table-wrapper">
                    <table class="cities-table">
                        <thead>
                            <tr>
                                <th>City</th>
                                <th>Country</th>
                                <th>Current Time</th>
                                <th>Date</th>
                                <th>Timezone</th>
                            </tr>
                        </thead>
                        <tbody id="citiesTableBody">
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                    <div id="noResults" class="no-results" style="display: none;">
                        No cities found matching your search.
                    </div>
                </div>
            </div>
        </div>
    </div>

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');

        }

        function createClockCards() {
            const grid = document.getElementById('clocksGrid');
            
            Object.entries(CITIES).forEach(([city, data]) => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.id = `clock-${city.replace(/\s+/g, '-')}`;
                
                card.innerHTML = `
                    <div class="city-name">${city}</div>
                    <div class="timezone-offset" data-city="${city}"></div>
                    <div class="analog-clock">
                        <div class="clock-hand hour-hand"></div>
                        <div class="clock-hand minute-hand"></div>

                        <div class="clock-center"></div>

                    <div class="date-display"></div>

            });

            const today = new Date().toISOString().split('T')[0];

        function updateAllClocks() {
            Object.entries(CITIES).forEach(([city, data]) => {
                updateClock(city, data.tz);
            });
        }

        function updateClock(city, timezone) {
            const now = new Date();
            const options = { timeZone: timezone };
            
            // Get time components
            const timeString = now.toLocaleTimeString('en-US', { 
                ...options, 
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            const [hours, minutes, seconds] = timeString.split(':').map(Number);
            
            // Get date
            const dateString = now.toLocaleDateString('en-US', {
                ...options,
                weekday: 'short',
                month: 'short',
                day: 'numeric'
            });
            
            // Get timezone offset
            const offsetString = now.toLocaleTimeString('en-US', {
                ...options,
                timeZoneName: 'short'
            }).split(' ').pop();
            
            // Update card
            const cardId = `clock-${city.replace(/\s+/g, '-')}`;
            const card = document.getElementById(cardId);
            
            if (card) {
                // Update timezone offset
                const offsetEl = card.querySelector('.timezone-offset');
                if (offsetEl) {
                    offsetEl.textContent = offsetString;
                }
                
                // Update analog clock hands
                const hourHand = card.querySelector('.hour-hand');
                const minuteHand = card.querySelector('.minute-hand');
                const secondHand = card.querySelector('.second-hand');
                
                const secondDeg = seconds * 6;
                const minuteDeg = minutes * 6 + seconds * 0.1;
                const hourDeg = (hours % 12) * 30 + minutes * 0.5;
                
                if (secondHand) secondHand.style.transform = `rotate(${secondDeg}deg)`;
                if (minuteHand) minuteHand.style.transform = `rotate(${minuteDeg}deg)`;
                if (hourHand) hourHand.style.transform = `rotate(${hourDeg}deg)`;
                
                // Update digital time
                const digitalTime = card.querySelector('.digital-time');
                if (digitalTime) {
                    const display12h = now.toLocaleTimeString('en-US', {
                        ...options,
                        hour: 'numeric',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });
                    digitalTime.textContent = display12h;
                }
                
                // Update date
                const dateDisplay = card.querySelector('.date-display');
                if (dateDisplay) {
                    dateDisplay.textContent = dateString;
                }
            }
        }

        function populateCitiesTable() {
            const tbody = document.getElementById('citiesTableBody');
            tbody.innerHTML = '';
            
            // Sort cities alphabetically
            const sortedCities = Object.entries(ALL_CITIES).sort((a, b) => a[0].localeCompare(b[0]));
            
            sortedCities.forEach(([city, data]) => {
                const row = document.createElement('tr');
                row.setAttribute('data-city', city.toLowerCase());
                row.setAttribute('data-country', data.country.toLowerCase());
                
                row.innerHTML = `
                    <td class="table-city-name">${city}</td>
                    <td class="table-country">${data.country}</td>
                    <td class="table-time" data-tz="${data.tz}"></td>
                    <td class="table-date" data-tz="${data.tz}"></td>
                    <td class="table-timezone"></td>
                `;
                
                tbody.appendChild(row);
            });
        }

        function updateCitiesTable() {
            const now = new Date();
            const rows = document.querySelectorAll('#citiesTableBody tr');
            
            rows.forEach(row => {
                const timeCell = row.querySelector('.table-time');
                const dateCell = row.querySelector('.table-date');
                const timezoneCell = row.querySelector('.table-timezone');
                
                if (timeCell && dateCell) {
                    const tz = timeCell.getAttribute('data-tz');
                    
                    const timeString = now.toLocaleTimeString('en-US', {
                        timeZone: tz,
                        hour: 'numeric',
                        minute: '2-digit',
                        second: '2-digit',
                        hour12: true
                    });
                    
                    const dateString = now.toLocaleDateString('en-US', {
                        timeZone: tz,
                        weekday: 'short',
                        month: 'short',
                        day: 'numeric'
                    });
                    
                    const offsetString = now.toLocaleTimeString('en-US', {
                        timeZone: tz,
                        timeZoneName: 'short'
                    }).split(' ').pop();
                    
                    timeCell.textContent = timeString;
                    dateCell.textContent = dateString;
                    timezoneCell.textContent = offsetString;
                }
            });
        }

        function filterCities() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const rows = document.querySelectorAll('#citiesTableBody tr');
            let visibleCount = 0;
            
            rows.forEach(row => {
                const city = row.getAttribute('data-city');
                const country = row.getAttribute('data-country');
                
                if (city.includes(searchTerm) || country.includes(searchTerm)) {
                    row.style.display = '';
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });
            
            const noResults = document.getElementById('noResults');
            const tableWrapper = document.querySelector('.cities-table-wrapper table');
            
            if (visibleCount === 0) {
                noResults.style.display = 'block';
                if (tableWrapper) tableWrapper.style.display = 'none';
            } else {
                noResults.style.display = 'none';
                if (tableWrapper) tableWrapper.style.display = 'table';
            }
        }

        function convertTime() {
            const sourceCity = document.getElementById('sourceCity').value;
            const destCity = document.getElementById('destCity').value;
            const sourceTime = document.getElementById('sourceTime').value;
            const sourceDate = document.getElementById('sourceDate').value;
            
            if (!sourceCity || !destCity || !sourceTime || !sourceDate) {
                alert('Please fill in all fields');
                return;
            }
            
            const sourceTz = CITIES[sourceCity].tz;
            const destTz = CITIES[destCity].tz;
            
            // Parse input
            const [hours, minutes] = sourceTime.split(':').map(Number);
            const [year, month, day] = sourceDate.split('-').map(Number);
            
            // Create a date string that represents the time in the SOURCE timezone
            // Use ISO format with timezone info
            const isoString = `${sourceDate}T${sourceTime}:00`;
            
            // Get the offset of the source timezone at the specified date
            // Create a formatter for the source timezone
            const sourceFormatter = new Intl.DateTimeFormat('en-US', {
                timeZone: sourceTz,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            
            // Create a date in UTC
            const utcDate = new Date(`${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}T${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:00Z`);
            
            // Get what this UTC time appears as in the source timezone
            const sourceDisplay = sourceFormatter.format(utcDate);
            const [sourceDisplayDate, sourceDisplayTime] = sourceDisplay.split(', ');
            const [displayMonth, displayDay, displayYear] = sourceDisplayDate.split('/');
            const [displayHours, displayMinutes] = sourceDisplayTime.split(':');
            
            // Calculate the difference between what we want and what we got
            const wantedMinutes = hours * 60 + minutes;
            const gotMinutes = parseInt(displayHours) * 60 + parseInt(displayMinutes);
            const diffMinutes = wantedMinutes - gotMinutes;
            
            // Adjust the UTC date by this difference
            const correctUtcDate = new Date(utcDate.getTime() + (diffMinutes * 60000));
            
            // Now format both source and destination using this correct UTC time
            const sourceOptions = {
                timeZone: sourceTz,
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                weekday: 'long'
            };
            
            const destOptions = {
                timeZone: destTz,
                hour: 'numeric',
                minute: '2-digit',
                hour12: true,
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                weekday: 'long'
            };
            
            const sourceFormatted = correctUtcDate.toLocaleString('en-US', sourceOptions);
            const destFormatted = correctUtcDate.toLocaleString('en-US', destOptions);
            
            const sourceTimeOnly = correctUtcDate.toLocaleString('en-US', {
                timeZone: sourceTz,
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            
            const destTimeOnly = correctUtcDate.toLocaleString('en-US', {
                timeZone: destTz,
                hour: 'numeric',
                minute: '2-digit',
                hour12: true
            });
            
            // Display results
            document.getElementById('sourceLocation').textContent = sourceCity;
            document.getElementById('sourceResultTime').textContent = sourceTimeOnly;
            document.getElementById('sourceFullDate').textContent = sourceFormatted;
            
            document.getElementById('destLocation').textContent = destCity;
            document.getElementById('destResultTime').textContent = destTimeOnly;
            document.getElementById('destFullDate').textContent = destFormatted;
            
            document.getElementById('resultContainer').classList.add('show');
        }
